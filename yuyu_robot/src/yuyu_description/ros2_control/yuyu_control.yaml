controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diffbot_base_controller:
      type: diff_drive_controller/DiffDriveController

diffbot_base_controller:
  ros__parameters:
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    wheel_separation: 0.12
    wheel_radius: 0.025
    publish_rate: 30.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    open_loop: false
    position_feedback: true
    use_stamped_vel: false
    cmd_vel_timeout: 0.35
    velocity_rolling_window_size: 5
    linear.x.has_velocity_limits: true
    linear.x.min_velocity: -0.025
    linear.x.max_velocity: 0.025
    linear.x.has_acceleration_limits: true
    linear.x.min_acceleration: -0.10
    linear.x.max_acceleration: 0.10
    angular.z.has_velocity_limits: true
    angular.z.min_velocity: -0.35
    angular.z.max_velocity: 0.35
    angular.z.has_acceleration_limits: true
    angular.z.min_acceleration: -0.8
    angular.z.max_acceleration: 0.8
