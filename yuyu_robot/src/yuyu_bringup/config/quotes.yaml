annoyed:
  - 心里乱的时候，先允许它乱一会儿。
  - 你不是不够好，只是今天事情有点多。
  - 慢一点也没关系，路不会跑。
  - 风大的时候，树也只是先弯一弯。
  - 今天烦了就先停下，没事的。
tired:
  - 累了就停，电量低不是故障。
  - 今天已经走了很远，不必再证明什么。
  - 休息不是偷懒，是给明天留力气。
  - 你可以什么都不做，就坐一会儿。
  - 辛苦了，抱抱自己。
happy:
  - 什么事这么开心？说出来让我也听听。
  - 你笑起来的时候，桌面都亮了一点。
  - 把开心存起来，留着阴天用。
  - 今天值得。
  - 真好啊，为你开心。
silent:
  - 不想说就不说，我陪你坐着。
  - 好，那我们安静一会儿。
  - 我在这里，不催你开口。
  - 今天可以只听风的声音。
  - 不用解释，休息一会儿吧。
none:
  - 我在呢。
  - 今天也一起慢慢来。
  - 需要我的时候，叫一声就好。
  - 歇一歇，看看窗外吧。
  - 很高兴陪你待在这里。
