bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 100
    default_server_timeout: 2000
    wait_for_service_timeout: 5000

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.01
      movement_time_allowance: 90.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.015
      yaw_goal_tolerance: 0.12
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.02
      lookahead_dist: 0.06
      min_lookahead_dist: 0.04
      max_lookahead_dist: 0.10
      lookahead_time: 1.0
      rotate_to_heading_angular_vel: 0.35
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.005
      approach_velocity_scaling_dist: 0.08
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.05
      regulated_linear_scaling_min_speed: 0.005
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.4
      max_angular_accel: 0.5
      allow_reversing: false

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.01
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 0.00001
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.08
    rotational_acc_lim: 0.5
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin: {plugin: nav2_behaviors/Spin}
    backup: {plugin: nav2_behaviors/BackUp}
    drive_on_heading: {plugin: nav2_behaviors/DriveOnHeading}
    wait: {plugin: nav2_behaviors/Wait}

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 1000

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity: [0.025, 0.0, 0.35]
    min_velocity: [-0.025, 0.0, -0.35]
    max_accel: [0.1, 0.0, 0.5]
    max_decel: [-0.1, 0.0, -0.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.35

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.01
      track_unknown_space: true
      robot_radius: 0.115
      footprint_padding: 0.003
      # 既加载已知桌沿/矮障碍物，也接收 SLAM 的环境更新。
      plugins: [desk_layer, obstacle_layer, inflation_layer]
      desk_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /desk_map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 4.9
          raytrace_max_range: 5.0
          max_obstacle_height: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.16
        cost_scaling_factor: 30.0
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 2.0
      rolling_window: true
      width: 1
      height: 1
      resolution: 0.01
      robot_radius: 0.115
      footprint_padding: 0.003
      plugins: [desk_layer, obstacle_layer, inflation_layer]
      desk_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /desk_map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 4.9
          raytrace_max_range: 5.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.16
        cost_scaling_factor: 30.0
      always_send_full_costmap: true
